# netlify.toml
# Configuration for 4X Wealth Static Hosting on Netlify

[build]
  publish = "."

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/sif-screener"
  to = "/sif-tracker.html"
  status = 200

[[redirects]]
  from = "/sif-tracker"
  to = "/sif-tracker.html"
  status = 200
